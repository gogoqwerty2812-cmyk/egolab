<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; object-src 'none'; base-uri 'self'">
  <meta name="theme-color" content="#F1ECE5">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='15'%20fill='%23B06B4F'/%3E%3Cg%20fill='%23fff'%3E%3Cpath%20d='M20%2016%20L50%2016%20L46%2025%20L16%2025%20Z'/%3E%3Cpath%20d='M18.3%2028%20L44%2028%20L40%2037%20L14.3%2037%20Z'/%3E%3Cpath%20d='M16.6%2040%20L48%2040%20L44%2049%20L12.6%2049%20Z'/%3E%3Cpath%20d='M24%2025%20L31%2025%20L19%2049%20L12%2049%20Z'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap">
  <title>EgoLab</title>
  <!-- seo -->
  <meta name="robots" content="noindex, follow">
  <style>
    :root{
      --bg:#F1ECE5; --fg:#2B2620; --muted:#6C6257; --accent:#B06B4F; --accent-2:#C88B6F;
      --surface:#FBF8F3; --border:#E1D8CB; --primary:#B06B4F; --primary-hover:#995A40; --block:#B98B79;
      --font-display:'Anton','Oswald','Arial Narrow',sans-serif; --font-body:'Inter',system-ui,sans-serif;
      --font-mono:'JetBrains Mono',ui-monospace,monospace;
    }
    *{box-sizing:border-box;margin:0}
    body{background:var(--bg);color:var(--fg);font-family:var(--font-body);min-height:100vh;
      display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased}
    .card{position:relative;overflow:hidden;isolation:isolate;width:min(640px,100%);text-align:center;
      border-radius:16px;background:var(--block);color:#fff;padding:clamp(36px,7vw,64px) clamp(22px,5vw,48px);
      box-shadow:0 30px 60px -20px rgba(60,45,35,.28);animation:rise .6s cubic-bezier(.16,1,.3,1) both}
    .card::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
      background:repeating-linear-gradient(115deg,rgba(255,255,255,.08) 0 2px,transparent 2px 22px);
      -webkit-mask-image:linear-gradient(90deg,transparent,#000 80%);mask-image:linear-gradient(90deg,transparent,#000 80%)}
    .mark{width:46px;height:46px;border-radius:8px;background:#fff;color:var(--primary);
      display:grid;place-items:center;font-family:var(--font-display);font-size:1.5rem;margin:0 auto 22px}
    .code{font-family:var(--font-display);font-size:clamp(6rem,24vw,10.5rem);line-height:.88;letter-spacing:.01em}
    .code em{font-style:normal;color:#2B2620;opacity:.85}
    h1{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(1.6rem,4.5vw,2.2rem);margin:14px 0 10px}
    p{color:rgba(255,255,255,.88);font-size:1.02rem;line-height:1.6;margin:0 auto 28px;max-width:42ch}
    .btn{display:inline-flex;align-items:center;gap:9px;padding:14px 26px;border-radius:6px;
      background:#fff;color:#1c1612;text-decoration:none;font-weight:700;font-size:.9rem;
      text-transform:uppercase;letter-spacing:.04em;box-shadow:0 10px 24px rgba(40,25,15,.2);
      transition:transform .14s cubic-bezier(.34,1.56,.64,1),box-shadow .2s ease}
    .btn:hover{transform:translateY(-2px);box-shadow:0 16px 30px rgba(40,25,15,.26)}
    .btn:active{transform:scale(.96)}
    .btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--block),0 0 0 5px #fff}
    .eyebrow{font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.2em;font-size:.72rem;color:rgba(255,255,255,.85);font-weight:600;margin-bottom:16px}
    @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.card{animation:none}.btn{transition:none}}
  </style>
  <script>(function(){try{var s=localStorage.getItem('mkt_theme');document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
</head>
<body>
  <div class="card">
    <div class="mark"><svg viewBox="0 0 64 64" width="30" height="30" fill="currentColor" aria-hidden="true"><path d="M20 16 L50 16 L46 25 L16 25 Z"/><path d="M18.3 28 L44 28 L40 37 L14.3 37 Z"/><path d="M16.6 40 L48 40 L44 49 L12.6 49 Z"/><path d="M24 25 L31 25 L19 49 L12 49 Z"/></svg></div>
    <div class="eyebrow" id="eyebrow">Page not found</div>
    <div class="code">4<em>0</em>4</div>
    <h1 id="title">This page doesn't exist</h1>
    <p id="desc">The link may be broken or the page may have been moved. Let's get you back to the store.</p>
    <a class="btn" id="homeBtn" href="/">Back to store</a>
  </div>
  <script>
    (function(){
      var L={
        en:["Page not found","This page doesn't exist","The link may be broken or the page may have been moved. Let's get you back to the store.","Back to store"],
        ru:["Страница не найдена","Такой страницы нет","Ссылка устарела или страница была перемещена. Вернёмся в магазин.","Вернуться в магазин"],
        de:["Seite nicht gefunden","Diese Seite existiert nicht","Der Link ist evtl. defekt oder die Seite wurde verschoben.","Zurück zum Shop"],
        fr:["Page introuvable","Cette page n'existe pas","Le lien est peut-être rompu ou la page a été déplacée.","Retour à la boutique"],
        es:["Página no encontrada","Esta página no existe","El enlace puede estar roto o la página se ha movido.","Volver a la tienda"],
        it:["Pagina non trovata","Questa pagina non esiste","Il link potrebbe essere rotto o la pagina spostata.","Torna al negozio"],
        pl:["Nie znaleziono strony","Ta strona nie istnieje","Link może być nieaktualny lub strona została przeniesiona.","Powrót do sklepu"],
        sr:["Stranica nije pronađena","Ova stranica ne postoji","Link je možda zastareo ili je stranica premeštena.","Nazad u prodavnicu"]
      };
      var lang="en";
      try{var s=localStorage.getItem('mkt_lang');if(s&&L[s])lang=s;}catch(e){}
      var t=L[lang]||L.en;
      document.documentElement.lang=lang;
      document.getElementById('eyebrow').textContent=t[0];
      document.getElementById('title').textContent=t[1];
      document.getElementById('desc').textContent=t[2];
      document.getElementById('homeBtn').textContent=t[3];
      var parts=location.pathname.split('/').filter(Boolean);
      document.getElementById('homeBtn').setAttribute('href', parts.length>1?('/'+parts[0]+'/'):'/');
    })();
  </script>
</body>
</html>
